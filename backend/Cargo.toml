[package]
name = "stac-geoparquet-validator"
version = "0.1.0"
edition = "2024"
description = "Validate stac-geoparquet files"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "60", features = ["async", "object_store", "arrow", "geospatial", "zstd", "snap", "lz4", "brotli", "flate2"] }
arrow-schema = "60"
arrow-array = "60"
arrow-cast = "60"
object_store = { version = "0.14", features = ["http", "aws"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
bytes = "1"
futures = "0.3"
jsonschema = { version = "0.60", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls"] }
url = "2"

[dev-dependencies]
arrow = "60"
