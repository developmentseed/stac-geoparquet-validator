[package]
name = "stac-geoparquet-validator"
version = "0.1.0"
edition = "2024"
description = "Validate stac-geoparquet files"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parquet = { version = "60", features = ["async", "object_store", "arrow", "geospatial", "zstd", "snap", "lz4", "brotli", "flate2"] }
arrow-schema = "60"
object_store = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bytes = "1"
futures = "0.3"
jsonschema = { version = "0.60", default-features = false }

[dev-dependencies]
arrow = "60"
arrow-array = "60"
